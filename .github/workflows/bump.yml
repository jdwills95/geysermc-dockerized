name: Bump version in git

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version
        run: |
          git config --global user.email "jdwills95+actions@gmail.com"
          git config --global user.name "Actions"
          bash bump/gitbump.sh
          VERSION=$(git tag --sort=-v:refname --list "v[0-9]*" | head -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Docker Version Tag: $VERSION"
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            darthmanatee/geysermcdockerized:${{ env.VERSION }}
            darthmanatee/geysermcdockerized:latest
